# Odoo 20 CE lead — subdominio lead20.integraia.lat (SPEC 74)
# Espejo del bloque lead.integraia.lat del 19 (jumpjibe.com.conf), nombres odoo20*.
# Fuente versionada: odoo20-skeleton/odoo20/nginx-lead20.conf
# Aplicación: copiar a /etc/nginx/sites-available/odoo20.conf + symlink sites-enabled
# (ver README.md sección nginx; los puertos 38069/38072 son del compose de odoo20)

upstream odoo20_leads {
    server 127.0.0.1:38069;
}

# Upstream longpolling/evented
upstream odoo20_leads_longpolling {
    server 127.0.0.1:38072;
}

server {
    listen 80;
    server_name lead20.integraia.lat;
    return 301 https://lead20.integraia.lat$request_uri;
}

server {
    listen 443 ssl http2;
    server_name lead20.integraia.lat;

    client_max_body_size 50M;
    ssl_certificate /etc/letsencrypt/live/lead20.integraia.lat/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/lead20.integraia.lat/privkey.pem;
    ssl_trusted_certificate /etc/letsencrypt/live/lead20.integraia.lat/chain.pem;
    include snippets/ssl.conf;
    include snippets/letsencrypt.conf;

    access_log /var/log/nginx/odoo20_leads.access.log;
    error_log /var/log/nginx/odoo20_leads.error.log;

    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;
    proxy_set_header X-Forwarded-Host $host;

    proxy_read_timeout 720s;
    proxy_connect_timeout 720s;
    proxy_send_timeout 720s;

    proxy_buffering off;

    location ~ \.css$ {
        proxy_pass http://odoo20_leads;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        add_header Content-Type "text/css" always;
    }

    location ~* /web/static/ {
        proxy_pass http://odoo20_leads;
        proxy_cache_valid 200 90m;
        proxy_buffering on;
        expires 864000;
        add_header Cache-Control "public, immutable";

        location ~ \.css$ {
            add_header Content-Type "text/css" always;
        }
    }

    location / {
        proxy_pass http://odoo20_leads;
        proxy_redirect http://odoo20_leads/ https://lead20.integraia.lat/;
        proxy_redirect https://odoo20_leads/ https://lead20.integraia.lat/;
        proxy_redirect /web/ /web/;
    }

    location /longpolling/ {
        proxy_pass http://odoo20_leads_longpolling;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_read_timeout 900s;
        proxy_connect_timeout 900s;
        proxy_send_timeout 900s;
    }
}
